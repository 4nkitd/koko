name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact_name: koko-darwin-arm64
          - os: macos-13
            goos: darwin
            goarch: amd64
            artifact_name: koko-darwin-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact_name: koko-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            artifact_name: koko-linux-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact_name: koko-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.goos == 'darwin' && '1' || '0' }}
        run: |
          go build -ldflags="-s -w" -o ${{ matrix.artifact_name }} main.go

      - name: Compress Release Artifact (Unix)
        if: matrix.goos != 'windows'
        run: |
          tar -czvf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}

      - name: Compress Release Artifact (Windows)
        if: matrix.goos == 'windows'
        shell: powershell
        run: |
          Compress-Archive -Path ${{ matrix.artifact_name }} -DestinationPath koko-windows-amd64.zip

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
